name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/exercise-app-folder-96gr5d
    paths:
      - 'exercise-app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exercise-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate native Android project (prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -storepass ejercicios -keypass ejercicios \
            -alias ejercicios -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Ejercicios, OU=App, O=Ejercicios, L=NA, S=NA, C=ES"

      - name: Build release APK
        working-directory: exercise-app/android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
            -Pandroid.injected.signing.store.password=ejercicios \
            -Pandroid.injected.signing.key.alias=ejercicios \
            -Pandroid.injected.signing.key.password=ejercicios \
            --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ejercicios.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ejercicios-apk
          path: exercise-app/ejercicios.apk

      - name: Publish APK as a Release (descarga directa)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Ejercicios APK (build ${{ github.run_number }})
          body: |
            APK instalable de la app **Ejercicios**.
            Descarga `ejercicios.apk` en tu Android e instálalo
            (activa "instalar de fuentes desconocidas").
          files: exercise-app/ejercicios.apk
          prerelease: true
